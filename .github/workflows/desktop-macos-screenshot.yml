name: desktop-macos-screenshot
on:
  push:
    branches: [main]
    paths: &desktop-client-paths
      - ".github/workflows/desktop-macos-screenshot.yml"
      - "apps/desktop/package.json"
      - "apps/desktop/assets/**"
      - "apps/desktop/frontend/**"
      - "apps/desktop/src/**"
      - "apps/desktop/scripts/**"
  pull_request:
    paths: *desktop-client-paths

permissions:
  contents: read

concurrency:
  group: desktop-macos-screenshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshot:
    name: macOS x64 and arm64 package
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rakazo/desktop build
      - name: Package unsigned darwin-x64 and darwin-arm64 apps
        run: |
          set -euo pipefail
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @rakazo/desktop exec electron-builder \
            --mac --x64 --arm64 --dir --publish never \
            -c.mac.identity=null -c.mac.notarize=false
          x64=""
          arm64=""
          while IFS= read -r bin; do
            if file "$bin" | grep -q x86_64; then
              x64="$bin"
            elif file "$bin" | grep -q arm64; then
              arm64="$bin"
            fi
          done < <(find apps/desktop/release -type f -path '*/MacOS/Rakazo' | sort)
          test -x "$x64"
          test -x "$arm64"
          echo "darwin-x64 $x64"
          echo "darwin-arm64 $arm64"
