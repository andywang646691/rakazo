name: release-desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable releases must validate and publish serially. Per-tag concurrency would let an older
  # release validate before a newer one publishes, then overwrite GitHub's "latest" pointer.
  group: release-desktop-stable
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, ancestry, and monotonicity
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Desktop releases must run from a tag, including manual dispatches." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Desktop releases use the stable vMAJOR.MINOR.PATCH channel." >&2
            exit 1
          fi

          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match desktop version $version." >&2
            exit 1
          fi

          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The workflow revision does not match the tagged commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Desktop releases must point to a commit already on main." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi

          latest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' |
              sort -V |
              tail -n 1
          )"
          if [[ -n "$latest_tag" ]]; then
            highest="$(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
            if [[ "$highest" != "$RELEASE_TAG" || "$latest_tag" == "$RELEASE_TAG" ]]; then
              echo "$RELEASE_TAG must be newer than published release $latest_tag." >&2
              exit 1
            fi
          fi

          if ! grep -qF "## [$version] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no [$version] section; prepare the release with the release skill first." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS artifacts
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build the Electron client
        run: pnpm --filter @rakazo/desktop build

      - name: Require macOS signing and notarization credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"

      - name: Package signed darwin-x64 and darwin-arm64 apps
        shell: bash
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: |
          set -euo pipefail
          pnpm --filter @rakazo/desktop exec electron-builder \
            --mac --x64 --arm64 --dir --publish never -c.forceCodeSigning=true
          x64=""
          arm64=""
          while IFS= read -r bin; do
            app="$(cd "$(dirname "$bin")/../.." && pwd)"
            if file "$bin" | grep -q x86_64; then
              x64="$app"
            elif file "$bin" | grep -q arm64; then
              arm64="$app"
            fi
          done < <(find apps/desktop/release -type f -path '*/MacOS/Rakazo' | sort)
          test -d "$x64"
          test -d "$arm64"
          codesign --verify --deep --strict --verbose=2 "$x64"
          codesign --verify --deep --strict --verbose=2 "$arm64"
          xcrun stapler validate "$x64"
          xcrun stapler validate "$arm64"
          ditto -c -k --keepParent "$x64" apps/desktop/release/Rakazo-darwin-x64.zip
          ditto -c -k --keepParent "$arm64" apps/desktop/release/Rakazo-darwin-arm64.zip

      - name: Remove the App Store Connect API key from the runner
        if: always()
        shell: bash
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
        run: rm -f "$APPLE_API_KEY"

      - name: Retain macOS archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos-${{ needs.validate.outputs.sha }}
          path: |
            apps/desktop/release/Rakazo-darwin-x64.zip
            apps/desktop/release/Rakazo-darwin-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attest and publish complete release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-macos-${{ needs.validate.outputs.sha }}
          path: release-artifacts
          merge-multiple: true
      - name: Verify both Mac archives
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "The release tag moved after the build started." >&2
            exit 1
          fi
          test -s release-artifacts/Rakazo-darwin-x64.zip
          test -s release-artifacts/Rakazo-darwin-arm64.zip
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Create draft and upload the Mac archives
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v heading="## [$RELEASE_VERSION] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --draft --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes \
            --title "Rakazo $RELEASE_TAG" --verify-tag
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove an incomplete draft
        if: failure() && steps.create_release.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft 2>/dev/null)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
